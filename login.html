<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PAWFORM</title>
  <meta name="description" content="Sign in to your PAWFORM account.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Design Tokens & Master Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="auth-page-body">

  <!-- Clean Auth Box with Brand Inside Top Center, No Navbar, No Footer -->
  <div class="auth-card-box">
    <!-- Brand Inside Top Center -->
    <div class="text-center mb-4">
      <a href="index.html" class="auth-brand-logo mb-2">PAWFORM</a>
      <h2 class="font-serif fs-4 mb-1 text-dark">Welcome Back</h2>
      <p class="text-secondary small mb-0">Sign in to your personal nutrition account</p>
    </div>

    <form id="pawformLoginForm">
      <div class="mb-3">
        <label for="loginEmail" class="form-label small fw-bold text-muted">Email Address</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="yourname@example.com"
          value="sarah@example.com" required>
      </div>

      <div class="mb-3">
        <label for="loginPassword" class="form-label small fw-bold text-muted">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="loginPassword" value="password123" placeholder="Enter password" required>
          <button class="btn btn-toggle-password" type="button" aria-label="Toggle password visibility" title="Show/Hide password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
        </div>
        <a href="forgot-password.html" class="small text-forest">Forgot password?</a>
      </div>

      <button type="submit" class="btn-paw-primary w-100 py-2 fs-6 mb-4">
        <span>Sign In to PAWFORM</span>
        <i class="bi bi-arrow-right"></i>
      </button>

      <div class="position-relative text-center mb-4">
        <hr class="text-muted">
        <span class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-muted small"
          style="font-size: 0.78rem;">OR CONTINUE WITH</span>
      </div>

      <!-- Google & Apple Social Login Buttons in Bottom -->
      <div class="d-flex flex-column gap-2 mb-3">
        <button type="button" class="auth-social-btn" id="googleLoginBtn">
          <i class="bi bi-google text-danger fs-6"></i>
          <span>Continue with Google</span>
        </button>
        <button type="button" class="auth-social-btn" id="appleLoginBtn">
          <i class="bi bi-apple fs-6 text-dark"></i>
          <span>Continue with Apple</span>
        </button>
      </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top small text-muted">
      Don't have an account yet? <a href="signup.html" class="text-forest fw-bold">Sign up here</a>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button id="backToTopBtn" class="btn-back-to-top" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('pawformLoginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Signed In', 'Welcome back to PAWFORM!', 'success');
      setTimeout(() => window.location.href = 'index.html', 400);
    });
    document.getElementById('googleLoginBtn')?.addEventListener('click', () => {
      showToast('Google Sign In', 'Signed in via Google account.', 'success');
      setTimeout(() => window.location.href = 'index.html', 400);
    });
    document.getElementById('appleLoginBtn')?.addEventListener('click', () => {
      showToast('Apple Sign In', 'Signed in via Apple ID.', 'success');
      setTimeout(() => window.location.href = 'index.html', 400);
    });
  </script>
</body>

</html>
