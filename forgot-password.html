<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — PAWFORM</title>
  <meta name="description" content="Reset your PAWFORM account password.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Design Tokens & Master Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page-body">

  <!-- Clean Auth Box with Brand Inside Top Center, No Navbar, No Footer -->
  <div class="auth-card-box">
    <!-- Brand Inside Top Center -->
    <div class="text-center mb-4">
      <a href="index.html" class="auth-brand-logo mb-2">PAWFORM</a>
      <h2 class="font-serif fs-4 mb-1 text-dark">Reset Password</h2>
      <p class="text-secondary small mb-0">Enter your email and we'll send reset instructions</p>
    </div>

    <!-- Form State -->
    <div id="resetFormState">
      <form id="pawformForgotForm">
        <div class="mb-4">
          <label for="resetEmail" class="form-label small fw-bold text-muted">Email Address</label>
          <input type="email" class="form-control" id="resetEmail" placeholder="yourname@example.com" required>
        </div>

        <button type="submit" class="btn-paw-primary w-100 py-2 fs-6 mb-3">
          <span>Send Reset Instructions</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>
    </div>

    <!-- Success State -->
    <div id="resetSuccessState" style="display: none;" class="text-center py-3">
      <div class="text-forest fs-1 mb-2"><i class="bi bi-envelope-check-fill"></i></div>
      <h4 class="font-serif mb-2">Check Your Email</h4>
      <p class="small text-secondary mb-4">
        If an account exists for that email, we've sent password reset instructions.
      </p>
      <a href="login.html" class="btn btn-sm btn-paw-outline">Back to Sign In</a>
    </div>

    <div class="text-center mt-4 pt-3 border-top small text-muted">
      Remember your password? <a href="login.html" class="text-forest fw-bold">Sign in here</a>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button id="backToTopBtn" class="btn-back-to-top" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('pawformForgotForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('resetFormState').style.display = 'none';
      document.getElementById('resetSuccessState').style.display = 'block';
    });
  </script>
</body>
</html>
