<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — PAWFORM Community Features</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Design Tokens & Master Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-secondary">

  <!-- Sticky Editorial Navbar -->
  <nav class="paw-navbar navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo" href="index.html">PAWFORM</a>
      <a href="index.html" class="btn btn-sm btn-paw-outline">Back to Home</a>
    </div>
  </nav>

  <!-- Coming Soon Main Message -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container text-center max-w-600">
      <div class="brand-mark mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background-color: var(--color-forest);">
        <i class="bi bi-stars"></i>
      </div>
      <span class="badge bg-secondary-subtle text-dark border px-3 py-2 rounded-pill mb-3">Roadmap Feature</span>
      <h1 class="font-serif mb-3">Community Feeding Circles Coming Soon</h1>
      <p class="text-secondary mb-4">
        We are building peer-to-peer feeding circles, localized raw-co-op group purchasing, and interactive veterinary Q&A events.
      </p>

      <div class="paw-card p-4 bg-surface max-w-500 mx-auto mb-4">
        <h6 class="font-serif mb-2">Be the First to Know</h6>
        <form class="d-flex gap-2" onsubmit="event.preventDefault(); alert('Thank you! We have added you to the preview list.');">
          <input type="email" class="form-control form-control-sm" placeholder="your@email.com" required>
          <button type="submit" class="btn btn-sm btn-paw-primary text-nowrap">Notify Me</button>
        </form>
      </div>

      <a href="discover.html" class="btn-paw-outline">Explore Active Discoveries</a>
    </div>
  </main>

  <!-- Back to Top Button -->
  <button id="backToTopBtn" class="btn-back-to-top" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
