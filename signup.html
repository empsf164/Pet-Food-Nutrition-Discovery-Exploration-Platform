<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — PAWFORM</title>
  <meta name="description" content="Join PAWFORM to save videos and follow verified specialists.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Design Tokens & Master Styles -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page-body">

  <!-- Clean Auth Box with Brand Inside Top Center, No Navbar, No Footer -->
  <div class="auth-card-box" style="max-width: 520px;">
    <!-- Brand Inside Top Center -->
    <div class="text-center mb-4">
      <a href="index.html" class="auth-brand-logo mb-2">PAWFORM</a>
      <h2 class="font-serif fs-4 mb-1 text-dark">Create Your Account</h2>
      <p class="text-secondary small mb-0">Join the evidence-based pet nutrition community</p>
    </div>

    <form id="pawformSignupForm">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="signupName" class="form-label small fw-bold text-muted">Full Name</label>
          <input type="text" class="form-control" id="signupName" placeholder="Alex Morgan" required>
        </div>
        <div class="col-md-6">
          <label for="signupEmail" class="form-label small fw-bold text-muted">Email Address</label>
          <input type="email" class="form-control" id="signupEmail" placeholder="alex@example.com" required>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="signupPassword" class="form-label small fw-bold text-muted">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="signupPassword" placeholder="8+ characters" required>
            <button class="btn btn-toggle-password" type="button" aria-label="Toggle password visibility" title="Show/Hide password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="col-md-6">
          <label for="signupConfirmPassword" class="form-label small fw-bold text-muted">Confirm Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="signupConfirmPassword" placeholder="Repeat password" required>
            <button class="btn btn-toggle-password" type="button" aria-label="Toggle password visibility" title="Show/Hide password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Pet Interests Multi-Select Chips -->
      <div class="p-3 rounded-3 border mb-3" style="background-color: var(--bg-primary);">
        <label class="form-label small fw-bold text-forest mb-2 d-block">
          Select Your Companions:
        </label>
        <div class="d-flex flex-wrap gap-2">
          <label class="btn btn-sm btn-outline-secondary rounded-pill">
            <input type="checkbox" name="petSpecies" value="Dogs" class="me-1" checked> Dogs
          </label>
          <label class="btn btn-sm btn-outline-secondary rounded-pill">
            <input type="checkbox" name="petSpecies" value="Cats" class="me-1"> Cats
          </label>
          <label class="btn btn-sm btn-outline-secondary rounded-pill">
            <input type="checkbox" name="petSpecies" value="Puppies" class="me-1"> Puppies
          </label>
          <label class="btn btn-sm btn-outline-secondary rounded-pill">
            <input type="checkbox" name="petSpecies" value="Senior Pets" class="me-1" checked> Senior Pets
          </label>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="termsCheck" required>
        <label class="form-check-label small text-secondary" for="termsCheck">
          I agree to the <a href="about.html" class="text-forest">Terms</a> and acknowledge the <a href="about.html" class="text-forest">Veterinary Disclaimer</a>.
        </label>
      </div>

      <button type="submit" class="btn-paw-primary w-100 py-2 fs-6 mb-4">
        <span>Create Account</span>
        <i class="bi bi-arrow-right"></i>
      </button>

      <div class="position-relative text-center mb-4">
        <hr class="text-muted">
        <span class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-muted small" style="font-size: 0.78rem;">OR SIGN UP WITH</span>
      </div>

      <!-- Google & Apple Social Login Buttons in Bottom -->
      <div class="d-flex flex-column gap-2 mb-3">
        <button type="button" class="auth-social-btn" id="googleSignupBtn">
          <i class="bi bi-google text-danger fs-6"></i>
          <span>Sign up with Google</span>
        </button>
        <button type="button" class="auth-social-btn" id="appleSignupBtn">
          <i class="bi bi-apple fs-6 text-dark"></i>
          <span>Sign up with Apple</span>
        </button>
      </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top small text-muted">
      Already have an account? <a href="login.html" class="text-forest fw-bold">Sign in here</a>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button id="backToTopBtn" class="btn-back-to-top" aria-label="Back to top" title="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('pawformSignupForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Account Created', 'Welcome to PAWFORM!', 'success');
      setTimeout(() => window.location.href = 'index.html', 400);
    });
    document.getElementById('googleSignupBtn')?.addEventListener('click', () => {
      showToast('Google Sign Up', 'Created account with Google.', 'success');
      setTimeout(() => window.location.href = 'index.html', 400);
    });
    document.getElementById('appleSignupBtn')?.addEventListener('click', () => {
      showToast('Apple Sign Up', 'Created account with Apple ID.', 'success');
      setTimeout(() => window.location.href = 'index.html', 400);
    });
  </script>
</body>
</html>
